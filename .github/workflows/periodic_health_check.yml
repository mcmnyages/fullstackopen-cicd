name: Periodic health check

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check health of the deployed application
        uses: jtalk/url-health-check-action@v4
        with:
          # Replace this with your actual Render/production app URL and health endpoint
          url: ${{ vars.APP_URL }}